<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港駕車助手 - 隧道收費 & 油耗計算</title>
  
  <!-- PWA & Web App Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563EB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="駕車助手">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    .tab-active {
      color: #2563EB;
      border-bottom: 3px solid #2563EB;
      font-weight: 700;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #CBD5E1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col antialiased selection:bg-blue-200">

  <!-- App Header -->
  <header class="bg-blue-600 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid font-bold fa-car-side text-yellow-300 text-xl"></i>
        <h1 class="text-lg font-bold tracking-wide">香港駕車助手</h1>
      </div>
      <span class="text-xs bg-blue-700 px-2.5 py-1 rounded-full text-blue-100 font-medium border border-blue-500/30">
        PWA Ready
      </span>
    </div>

    <!-- Navigation Tabs -->
    <nav class="bg-white text-gray-600 shadow-inner flex border-b border-gray-200 text-sm">
      <button id="tab1" onclick="switchPage(1)" class="flex-1 py-3 text-center transition-colors flex items-center justify-center space-x-1 tab-active">
        <i class="fa-solid fa-road text-base"></i>
        <span>Page 1: 隧道收費</span>
      </button>
      <button id="tab2" onclick="switchPage(2)" class="flex-1 py-3 text-center transition-colors flex items-center justify-center space-x-1">
        <i class="fa-solid font-bold fa-calculator text-base"></i>
        <span>Page 2: 油耗與專案</span>
      </button>
    </nav>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 pb-12">

    <!-- PAGE 1: 隧道收費 -->
    <section id="page1" class="space-y-4">
      
      <!-- Current Status Card -->
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 relative overflow-hidden">
        <div class="flex justify-between items-start mb-3">
          <div>
            <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-1">選擇隧道</label>
            <div class="relative inline-block">
              <select id="tunnelSelect" onchange="updateTunnelData()" class="text-lg font-bold text-gray-800 bg-gray-50 border border-gray-300 rounded-lg px-3 py-1.5 pr-8 focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none cursor-pointer">
                <option value="tai_lam" selected>大欖隧道 (Tai Lam Tunnel)</option>
                <option value="cross_harbour">紅磡海底隧道 (CHT)</option>
                <option value="eastern">東區海底隧道 (EHT)</option>
                <option value="western font-bold">西區海底隧道 (WHT)</option>
                <option value="tate_cairn">大老山隧道</option>
                <option value="shing_mun">城門隧道</option>
              </select>
              <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-xs"></i>
            </div>
          </div>
          <span id="liveBadge" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-800 border border-green-200">
            <span class="w-2 h-2 mr-1.5 bg-green-500 rounded-full animate-pulse"></span> 即時時段
          </span>
        </div>

        <div class="my-4 pt-2 border-t border-gray-100">
          <div class="text-xs text-gray-500 mb-1">私家車現時收費</div>
          <div class="flex items-baseline space-x-2">
            <span id="currentFee" class="text-4xl font-black text-blue-600">$0</span>
            <span id="currentPeriodName" class="text-sm font-semibold text-gray-600 bg-gray-100 px-2 py-0.5 rounded">一般時段</span>
          </div>
        </div>

        <!-- Next Period Alert -->
        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 flex items-center justify-between text-xs text-amber-900">
          <div class="flex items-center space-x-2">
            <i class="fa-solid fa-clock-rotate-left text-amber-600 text-sm"></i>
            <div>
              <span class="font-medium">下一時段：</span>
              <span id="nextPeriodInfo" class="font-bold">--:-- 開始 ($--)</span>
            </div>
          </div>
          <span id="timeCountdown" class="font-mono bg-amber-200/60 text-amber-900 px-2 py-0.5 rounded font-bold">-- min</span>
        </div>
      </div>

      <!-- Schedule Table Card -->
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-bold text-gray-800 flex items-center space-x-2">
            <i class="fa-solid fa-calendar-days text-blue-600"></i>
            <span>詳細收費表 (私家車)</span>
          </h2>
          <span class="text-xs text-gray-400" id="todayType">星期一至六</span>
        </div>

        <div class="overflow-x-auto rounded-xl border border-gray-100">
          <table class="w-full text-left text-sm">
            <thead class="bg-gray-50 text-gray-500 text-xs uppercase font-medium">
              <tr>
                <th class="py-2.5 px-3">時段名稱</th>
                <th class="py-2.5 px-3">時間範圍</th>
                <th class="py-2.5 px-3 text-right">標準收費</th>
              </tr>
            </thead>
            <tbody id="scheduleTableBody" class="divide-y divide-gray-100 text-gray-700">
              <!-- Dynamically Populated -->
            </tbody>
          </table>
        </div>
        <p class="text-[11px] text-gray-400 mt-2.5 leading-relaxed">
          * 註：易通行三條過海隧道與大欖隧道實施分時段收費，過渡時段每2分鐘調整$1。此表顯示該時段之基準收費。
        </p>
      </div>
    </section>

    <!-- PAGE 2: 油耗與行程專案 -->
    <section id="page2" class="space-y-4 hidden">
      
      <!-- Part A: Average Fuel Price -->
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
        <h2 class="font-bold text-gray-800 mb-3 flex items-center space-x-2 text-base">
          <span class="bg-blue-100 text-blue-700 text-xs w-6 h-6 rounded-full flex items-center justify-center font-bold">A</span>
          <span>平均油價計算</span>
        </h2>

        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">A.1. 入油總價錢 ($)</label>
            <input type="number" id="inputA1" oninput="calcA()" placeholder="例如：800" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">A.2. 總入油量 (L)</label>
            <input type="number" id="inputA2" oninput="calcA()" placeholder="例如：35" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">A.3. 平均油價 ($/L) <span class="text-gray-400 font-normal">(可手動輸入)</span></label>
            <input type="number" id="inputA3" oninput="manualA3()" placeholder="自動計算或手動填寫" class="w-full bg-blue-50/50 border border-blue-200 text-blue-900 font-semibold rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
      </div>

      <!-- Part B: Fuel Consumption -->
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
        <h2 class="font-bold text-gray-800 mb-3 flex items-center space-x-2 text-base">
          <span class="bg-blue-100 text-blue-700 text-xs w-6 h-6 rounded-full flex items-center justify-center font-bold">B</span>
          <span>汽油使用量與行程計算</span>
        </h2>

        <div class="space-y-3">
          <!-- Mileage -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-gray-500 mb-1">B.1.1. 起始里程 (km)</label>
              <input type="number" id="inputB11" oninput="calcB()" placeholder="12000" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-500 mb-1">B.1.2. 結束里程 (km)</label>
              <input type="number" id="inputB12" oninput="calcB()" placeholder="12250" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>

          <!-- Fuel Efficiency Entries -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-gray-500 mb-1">B.1.3. 起始油耗記錄</label>
              <div class="flex space-x-1">
                <input type="number" id="inputB13" oninput="calcB()" placeholder="15.0" class="w-full bg-gray-50 border border-gray-200 rounded-l-xl px-2.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <select id="unitB13" onchange="calcB()" class="bg-gray-100 border border-l-0 border-gray-200 text-xs rounded-r-xl px-1 font-medium text-gray-600 focus:outline-none">
                  <option value="km/L">km/L</option>
                  <option value="L/km">L/km</option>
                </select>
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-500 mb-1">B.1.4. 結束油耗記錄</label>
              <div class="flex space-x-1">
                <input type="number" id="inputB14" oninput="calcB()" placeholder="14.2" class="w-full bg-gray-50 border border-gray-200 rounded-l-xl px-2.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <select id="unitB14" onchange="calcB()" class="bg-gray-100 border border-l-0 border-gray-200 text-xs rounded-r-xl px-1 font-medium text-gray-600 focus:outline-none">
                  <option value="km/L">km/L</option>
                  <option value="L/km">L/km</option>
                </select>
              </div>
            </div>
          </div>

          <!-- B.1.5 Average Efficiency -->
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">
              B.1.5. 該段平均油耗 <span class="text-gray-400 font-normal">(可由 B.1.1-B.1.4 算出或手動填)</span>
            </label>
            <div class="flex space-x-1">
              <input type="number" id="inputB15" oninput="manualB15()" placeholder="自動或手動輸入" class="w-full bg-blue-50/50 border border-blue-200 text-blue-900 font-semibold rounded-l-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <select id="unitB15" onchange="calcB()" class="bg-blue-100 border border-l-0 border-blue-200 text-xs rounded-r-xl px-2 font-semibold text-blue-800 focus:outline-none">
                <option value="km/L">km/L</option>
                <option value="L/km">L/km</option>
              </select>
            </div>
          </div>

          <!-- Calculated Results Readonly Grid -->
          <div class="pt-2 border-t border-gray-100 space-y-2">
            <div class="flex justify-between items-center text-sm py-1 border-b border-gray-50">
              <span class="text-gray-600 text-xs">B.1.6. 該段距離</span>
              <span id="outB16" class="font-bold text-gray-800">0.0 km</span>
            </div>
            <div class="flex justify-between items-center text-sm py-1 border-b border-gray-50">
              <span class="text-gray-600 text-xs">B.1.7. 該段汽油用量</span>
              <span id="outB17" class="font-bold text-gray-800">0.00 L</span>
            </div>
            <div class="flex justify-between items-center text-sm py-1 border-b border-gray-50">
              <span class="text-gray-600 text-xs">B.1.8. 該段汽油總成本</span>
              <span id="outB18" class="font-black text-blue-600 text-base">$0.00</span>
            </div>
            <div class="flex justify-between items-center text-sm py-1">
              <span class="text-gray-600 text-xs">B.1.9. 平均成本</span>
              <span id="outB19" class="font-bold text-emerald-600">$0.00 / km</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Part C: Save & Notes -->
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 space-y-3">
        <h3 class="font-bold text-gray-800 text-sm flex items-center space-x-2">
          <i class="fa-solid fa-bookmark text-blue-600"></i>
          <span>儲存目前計算專案</span>
        </h3>
        
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">專案名稱</label>
          <input type="text" id="projectNameInput" placeholder="例如：屯門往返銅鑼灣 / 假日出遊" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">備註 (可選)</label>
          <textarea id="projectNotesInput" rows="2" placeholder="備註駕駛狀況、油站優惠或路線..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <button onclick="saveCurrentProject()" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-2.5 rounded-xl shadow-md transition-colors flex items-center justify-center space-x-2 text-sm">
          <i class="fa-solid fa-floppy-disk"></i>
          <span>儲存專案至紀錄</span>
        </button>
      </div>

      <!-- Saved Projects History -->
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-bold text-gray-800 flex items-center space-x-2 text-sm">
            <i class="fa-solid fa-folder-open text-blue-600"></i>
            <span>已儲存的專案紀錄</span>
          </h2>
          <div class="flex items-center space-x-2">
            <button onclick="exportToCSV()" class="text-xs text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-2.5 py-1 rounded-lg transition-colors font-semibold flex items-center space-x-1">
              <i class="fa-solid fa-file-csv"></i>
              <span>匯出 CSV</span>
            </button>
            <button onclick="clearAllProjects()" class="text-xs text-red-500 hover:text-red-700 bg-red-50 px-2 py-1 rounded-lg transition-colors">
              清空
            </button>
          </div>
        </div>

        <div id="projectList" class="space-y-3 max-h-80 overflow-y-auto pr-1 custom-scrollbar">
          <!-- Dynamically Rendered -->
        </div>
      </div>
    </section>

  </main>

  <!-- EDIT PROJECT MODAL -->
  <div id="editModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4 transform transition-all">
      <div class="flex justify-between items-center border-b border-gray-100 pb-2">
        <h3 class="font-bold text-gray-800 text-base flex items-center space-x-2">
          <i class="fa-solid fa-pen-to-square text-blue-600"></i>
          <span>編輯專案資訊</span>
        </h3>
        <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <input type="hidden" id="editProjectId">

      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1">專案名稱</label>
        <input type="text" id="editProjectName" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1">備註 (Notes)</label>
        <textarea id="editProjectNotes" rows="3" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <div class="flex space-x-2 pt-2">
        <button onclick="closeEditModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 rounded-xl text-sm transition-colors">
          取消
        </button>
        <button onclick="saveProjectEdit()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-xl text-sm transition-colors shadow">
          儲存變更
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- PWA SERVICE WORKER REGISTRATION ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Registered'))
          .catch(err => console.log('SW Reg Error:', err));
      });
    }

    // --- TUNNEL DATA ---
    const TUNNEL_DATA = {
      tai_lam: {
        name: "大欖隧道",
        schedules: [
          { name: "離峰時段", start: "00:00", end: "07:30", fee: 18 },
          { name: "一般時段", start: "07:30", end: "10:15", fee: 45 },
          { name: "離峰時段", start: "10:15", end: "17:15", fee: 18 },
          { name: "一般時段", start: "17:15", end: "19:00", fee: 45 },
          { name: "離峰時段", start: "19:00", end: "23:59", fee: 18 }
        ]
      },
      cross_harbour: {
        name: "紅磡海底隧道 (CHT)",
        schedules: [
          { name: "夜間時段", start: "00:00", end: "07:30", fee: 20 },
          { name: "早繁忙時段", start: "07:30", end: "10:15", fee: 60 },
          { name: "一般時段", start: "10:15", end: "16:30", fee: 30 },
          { name: "晚繁忙時段", start: "16:30", end: "19:00", fee: 60 },
          { name: "夜間時段", start: "19:00", end: "23:59", fee: 20 }
        ]
      },
      eastern: {
        name: "東區海底隧道 (EHT)",
        schedules: [
          { name: "夜間時段", start: "00:00", end: "07:30", fee: 20 },
          { name: "早繁忙時段", start: "07:30", end: "10:15", fee: 60 },
          { name: "一般時段", start: "10:15", end: "16:30", fee: 30 },
          { name: "晚繁忙時段", start: "16:30", end: "19:00", fee: 60 },
          { name: "夜間時段", start: "19:00", end: "23:59", fee: 20 }
        ]
      },
      western: {
        name: "西區海底隧道 (WHT)",
        schedules: [
          { name: "夜間時段", start: "00:00", end: "07:30", fee: 20 },
          { name: "早繁忙時段", start: "07:30", end: "10:15", fee: 60 },
          { name: "一般時段", start: "10:15", end: "16:30", fee: 30 },
          { name: "晚繁忙時段", start: "16:30", end: "19:00", fee: 60 },
          { name: "夜間時段", start: "19:00", end: "23:59", fee: 20 }
        ]
      },
      tate_cairn: {
        name: "大老山隧道",
        schedules: [
          { name: "全日劃一收費", start: "00:00", end: "23:59", fee: 20 }
        ]
      },
      shing_mun: {
        name: "城門隧道",
        schedules: [
          { name: "全日劃一收費", start: "00:00", end: "23:59", fee: 5 }
        ]
      }
    };

    // Global Manual Override Flags
    let isManualA3 = false;
    let isManualB15 = false;

    // --- NAVIGATION ---
    function switchPage(pageNum) {
      document.getElementById('page1').classList.toggle('hidden', pageNum !== 1);
      document.getElementById('page2').classList.toggle('hidden', pageNum !== 2);
      
      document.getElementById('tab1').className = `flex-1 py-3 text-center transition-colors flex items-center justify-center space-x-1 ${pageNum === 1 ? 'tab-active' : ''}`;
      document.getElementById('tab2').className = `flex-1 py-3 text-center transition-colors flex items-center justify-center space-x-1 ${pageNum === 2 ? 'tab-active' : ''}`;
    }

    // --- PAGE 1 TUNNEL LOGIC ---
    function updateTunnelData() {
      const selectedKey = document.getElementById('tunnelSelect').value;
      const data = TUNNEL_DATA[selectedKey];
      
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      let currentScheduleIdx = -1;
      let activeFee = 0;
      let activePeriodName = "";

      for (let i = 0; i < data.schedules.length; i++) {
        const item = data.schedules[i];
        const [sh, sm] = item.start.split(':').map(Number);
        const [eh, em] = item.end.split(':').map(Number);
        const startMin = sh * 60 + sm;
        const endMin = eh * 60 + em;

        if (currentMinutes >= startMin && currentMinutes < endMin) {
          currentScheduleIdx = i;
          activeFee = item.fee;
          activePeriodName = item.name;
          break;
        }
      }

      if (currentScheduleIdx === -1) {
        currentScheduleIdx = data.schedules.length - 1;
        activeFee = data.schedules[currentScheduleIdx].fee;
        activePeriodName = data.schedules[currentScheduleIdx].name;
      }

      // Display current fee
      document.getElementById('currentFee').innerText = `$${activeFee}`;
      document.getElementById('currentPeriodName').innerText = activePeriodName;

      // Next Period Calculation
      const nextIdx = (currentScheduleIdx + 1) % data.schedules.length;
      const nextSchedule = data.schedules[nextIdx];
      const [nextH, nextM] = nextSchedule.start.split(':').map(Number);
      let nextTargetMin = nextH * 60 + nextM;
      if (nextTargetMin <= currentMinutes) {
        nextTargetMin += 24 * 60; // Next day
      }

      const diffMin = nextTargetMin - currentMinutes;
      document.getElementById('nextPeriodInfo').innerText = `${nextSchedule.start} 開始 (${nextSchedule.name} $${nextSchedule.fee})`;
      document.getElementById('timeCountdown').innerText = `${diffMin} min 後`;

      // Render Table
      const tbody = document.getElementById('scheduleTableBody');
      tbody.innerHTML = '';
      data.schedules.forEach((item, index) => {
        const isCurrent = (index === currentScheduleIdx);
        const tr = document.createElement('tr');
        tr.className = isCurrent ? 'bg-blue-50/80 font-semibold text-blue-900 border-l-4 border-blue-600' : 'hover:bg-gray-50';
        tr.innerHTML = `
          <td class="py-2.5 px-3 flex items-center space-x-1.5">
            ${isCurrent ? '<i class="fa-solid fa-circle-play text-blue-600 text-xs"></i>' : ''}
            <span>${item.name}</span>
          </td>
          <td class="py-2.5 px-3">${item.start} - ${item.end}</td>
          <td class="py-2.5 px-3 text-right font-bold">$${item.fee}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // --- PAGE 2 CALCULATIONS ---
    function calcA() {
      if (isManualA3) return;
      const a1 = parseFloat(document.getElementById('inputA1').value) || 0;
      const a2 = parseFloat(document.getElementById('inputA2').value) || 0;
      
      const a3Input = document.getElementById('inputA3');
      if (a1 > 0 && a2 > 0) {
        const avgPrice = a1 / a2;
        a3Input.value = avgPrice.toFixed(2);
      }
      calcB();
    }

    function manualA3() {
      isManualA3 = document.getElementById('inputA3').value !== '';
      calcB();
    }

    function manualB15() {
      isManualB15 = document.getElementById('inputB15').value !== '';
      calcB();
    }

    function getNormalizedEfficiency(valInputId, unitSelectId) {
      const val = parseFloat(document.getElementById(valInputId).value) || 0;
      const unit = document.getElementById(unitSelectId).value;
      if (val <= 0) return 0;
      return unit === 'km/L' ? val : (1 / val);
    }

    function calcB() {
      const b11 = parseFloat(document.getElementById('inputB11').value) || 0;
      const b12 = parseFloat(document.getElementById('inputB12').value) || 0;

      // Distance B.1.6
      const distance = (b12 > b11) ? (b12 - b11) : 0;
      document.getElementById('outB16').innerText = `${distance.toFixed(1)} km`;

      // Average Efficiency B.1.5
      let avgEfficiencyKmL = 0;
      const unitB15 = document.getElementById('unitB15').value;

      if (!isManualB15) {
        const effStart = getNormalizedEfficiency('inputB13', 'unitB13');
        const effEnd = getNormalizedEfficiency('inputB14', 'unitB14');

        if (effStart > 0 && effEnd > 0) {
          avgEfficiencyKmL = (effStart + effEnd) / 2;
          const displayVal = (unitB15 === 'km/L') ? avgEfficiencyKmL : (1 / avgEfficiencyKmL);
          document.getElementById('inputB15').value = displayVal.toFixed(2);
        }
      } else {
        avgEfficiencyKmL = getNormalizedEfficiency('inputB15', 'unitB15');
      }

      // Fuel Consumption B.1.7
      let fuelUsed = 0;
      if (distance > 0 && avgEfficiencyKmL > 0) {
        fuelUsed = distance / avgEfficiencyKmL;
      }
      document.getElementById('outB17').innerText = `${fuelUsed.toFixed(2)} L`;

      // Cost Calculation B.1.8 & B.1.9
      const a3Price = parseFloat(document.getElementById('inputA3').value) || 0;
      const totalCost = fuelUsed * a3Price;
      const costPerKm = (distance > 0) ? (totalCost / distance) : 0;

      document.getElementById('outB18').innerText = `$${totalCost.toFixed(2)}`;
      document.getElementById('outB19').innerText = `$${costPerKm.toFixed(2)} / km`;
    }

    // --- PROJECTS MANAGEMENT ---
    function getStoredProjects() {
      try {
        return JSON.parse(localStorage.getItem('car_helper_projects')) || [];
      } catch(e) {
        return [];
      }
    }

    function saveCurrentProject() {
      const nameInput = document.getElementById('projectNameInput');
      const notesInput = document.getElementById('projectNotesInput');
      const nowStr = new Date().toLocaleString('zh-HK', { hour12: false });
      
      const projName = nameInput.value.trim() || `行程紀錄 (${nowStr})`;
      const projNotes = notesInput.value.trim();

      const projectData = {
        id: Date.now(),
        date: nowStr,
        name: projName,
        notes: projNotes,
        a1: document.getElementById('inputA1').value,
        a2: document.getElementById('inputA2').value,
        a3: document.getElementById('inputA3').value,
        b11: document.getElementById('inputB11').value,
        b12: document.getElementById('inputB12').value,
        b13: document.getElementById('inputB13').value,
        unitB13: document.getElementById('unitB13').value,
        b14: document.getElementById('inputB14').value,
        unitB14: document.getElementById('unitB14').value,
        b15: document.getElementById('inputB15').value,
        unitB15: document.getElementById('unitB15').value,
        b16: document.getElementById('outB16').innerText,
        b17: document.getElementById('outB17').innerText,
        b18: document.getElementById('outB18').innerText,
        b19: document.getElementById('outB19').innerText
      };

      const projects = getStoredProjects();
      projects.unshift(projectData);
      localStorage.setItem('car_helper_projects', JSON.stringify(projects));

      nameInput.value = '';
      notesInput.value = '';
      renderProjectsList();
    }

    function loadProject(id) {
      const projects = getStoredProjects();
      const p = projects.find(item => item.id === id);
      if (!p) return;

      document.getElementById('inputA1').value = p.a1 || '';
      document.getElementById('inputA2').value = p.a2 || '';
      document.getElementById('inputA3').value = p.a3 || '';
      if(p.a3) isManualA3 = true;

      document.getElementById('inputB11').value = p.b11 || '';
      document.getElementById('inputB12').value = p.b12 || '';
      document.getElementById('inputB13').value = p.b13 || '';
      if(p.unitB13) document.getElementById('unitB13').value = p.unitB13;

      document.getElementById('inputB14').value = p.b14 || '';
      if(p.unitB14) document.getElementById('unitB14').value = p.unitB14;

      document.getElementById('inputB15').value = p.b15 || '';
      if(p.unitB15) document.getElementById('unitB15').value = p.unitB15;
      if(p.b15) isManualB15 = true;

      calcB();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteProject(id) {
      let projects = getStoredProjects();
      projects = projects.filter(item => item.id !== id);
      localStorage.setItem('car_helper_projects', JSON.stringify(projects));
      renderProjectsList();
    }

    function clearAllProjects() {
      if (confirm('確定要清空所有已儲存的專案紀錄嗎？')) {
        localStorage.removeItem('car_helper_projects');
        renderProjectsList();
      }
    }

    // --- MODAL EDIT FUNCTIONS ---
    function openEditModal(id) {
      const projects = getStoredProjects();
      const p = projects.find(item => item.id === id);
      if (!p) return;

      document.getElementById('editProjectId').value = p.id;
      document.getElementById('editProjectName').value = p.name || '';
      document.getElementById('editProjectNotes').value = p.notes || '';
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    function saveProjectEdit() {
      const id = parseInt(document.getElementById('editProjectId').value);
      const newName = document.getElementById('editProjectName').value.trim();
      const newNotes = document.getElementById('editProjectNotes').value.trim();

      let projects = getStoredProjects();
      const idx = projects.findIndex(p => p.id === id);
      if (idx !== -1) {
        projects[idx].name = newName || `行程紀錄 (${projects[idx].date})`;
        projects[idx].notes = newNotes;
        localStorage.setItem('car_helper_projects', JSON.stringify(projects));
        renderProjectsList();
      }
      closeEditModal();
    }

    // --- CSV EXPORT FUNCTION ---
    function exportToCSV() {
      const projects = getStoredProjects();
      if (projects.length === 0) {
        alert('目前沒有已儲存的專案紀錄可供匯出。');
        return;
      }

      // Headers 1st to 15th
      const headers = [
        "專案名稱",
        "輸入日期",
        "A.1. 入油總價錢 ($)",
        "A.2. 總入油量 (L)",
        "A.3. 平均油價 ($/L)",
        "B.1.1. 起始行程里數 (km)",
        "B.1.2. 結束行程里數 (km)",
        "B.1.3. 起始油耗記錄",
        "B.1.4. 結束油耗記錄",
        "B.1.5. 該段平均油耗",
        "B.1.6. 該段距離",
        "B.1.7. 該段汽油用量",
        "B.1.8. 該段汽油總成本",
        "B.1.9. 該段汽油平均成本",
        "備註 (Notes)"
      ];

      function escapeCSV(val) {
        if (val === undefined || val === null) return '""';
        const str = String(val).replace(/"/g, '""');
        return `"${str}"`;
      }

      let csvRows = [];
      csvRows.push(headers.map(escapeCSV).join(','));

      projects.forEach(p => {
        const row = [
          p.name,
          p.date,
          p.a1,
          p.a2,
          p.a3,
          p.b11,
          p.b12,
          p.b13 ? `${p.b13} ${p.unitB13 || 'km/L'}` : '',
          p.b14 ? `${p.b14} ${p.unitB14 || 'km/L'}` : '',
          p.b15 ? `${p.b15} ${p.unitB15 || 'km/L'}` : '',
          p.b16,
          p.b17,
          p.b18,
          p.b19,
          p.notes || ''
        ];
        csvRows.push(row.map(escapeCSV).join(','));
      });

      const csvContent = "\uFEFF" + csvRows.join("\n");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `car_projects_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function renderProjectsList() {
      const container = document.getElementById('projectList');
      const projects = getStoredProjects();

      if (projects.length === 0) {
        container.innerHTML = `
          <div class="text-center py-6 text-gray-400 text-xs">
            尚無儲存紀錄。計算完畢後填寫專案名稱即可儲存！
          </div>
        `;
        return;
      }

      container.innerHTML = projects.map(p => `
        <div class="p-3 bg-gray-50 border border-gray-200 rounded-xl hover:border-blue-300 transition-colors text-xs space-y-1.5">
          <div class="flex justify-between items-start">
            <div class="font-bold text-gray-800 text-sm truncate max-w-[170px]">${p.name}</div>
            <div class="flex items-center space-x-1.5">
              <button onclick="openEditModal(${p.id})" title="編輯專案資訊" class="text-gray-400 hover:text-blue-600 p-0.5">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button onclick="loadProject(${p.id})" class="text-blue-600 hover:text-blue-800 font-semibold text-xs px-2 py-0.5 bg-blue-50 hover:bg-blue-100 rounded-md">
                載入
              </button>
              <button onclick="deleteProject(${p.id})" class="text-gray-400 hover:text-red-500 p-0.5">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
          
          <div class="text-[11px] text-gray-400">${p.date}</div>

          ${p.notes ? `<div class="bg-white/80 p-1.5 rounded border border-gray-100 text-gray-600 italic text-[11px] leading-tight">💬 ${p.notes}</div>` : ''}

          <div class="grid grid-cols-3 gap-1 pt-1 text-[11px] text-gray-600 border-t border-gray-200/60">
            <div>距離: <span class="font-semibold text-gray-800">${p.b16}</span></div>
            <div>總耗: <span class="font-semibold text-gray-800">${p.b18}</span></div>
            <div class="text-right">單價: <span class="font-semibold text-emerald-600">${p.b19}</span></div>
          </div>
        </div>
      `).join('');
    }

    // --- INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      updateTunnelData();
      renderProjectsList();
      setInterval(updateTunnelData, 60000);
    });
  </script>
